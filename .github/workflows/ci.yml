name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore day4/Day4.slnx

      - name: Build
        run: dotnet build day4/Day4.slnx --no-restore

      - name: Test
        run: >
          dotnet test day4/Day4.slnx
          --no-build
          --settings day4/coverage.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Check coverage
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "day4" -Recurse -Filter "coverage.cobertura.xml" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $file) {
            Write-Error "Coverage file not found."
            exit 1
          }

          [xml]$coverage = Get-Content $file.FullName
          $lineRate = [double]$coverage.coverage.'line-rate'
          $percentage = $lineRate * 100

          Write-Host "Line coverage: $percentage%"

          if ($percentage -lt 70) {
            Write-Error "Coverage is below 70%."
            exit 1
          }

          Write-Host "Coverage requirement passed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            day4/**/TestResults/**/*.trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            day4/**/TestResults/**/coverage.cobertura.xml